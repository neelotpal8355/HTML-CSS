<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEO BOOK STORE</title>
    <script>
      const style = document.createElement('style');
      style.innerHTML = `
        body {
          background-color: #cf8782;
          margin: 0;
          padding: 0;
        }
        table {
          margin: 50px auto;
          border-collapse: collapse;
          width: 80%;
        }
        th, td {
          border: 2px solid #e7b98b;
          padding: 18px 12px;
          text-align: left;
        }
        th {
          background-color: #fde7b3;
          font-size: 1.18em;
        }
        tr:first-child th {
          font-size: 2em;
          text-align: center;
          background-color: #fde7b3;
        }
        td {
          background-color: #fff9f5;
        }
        .dept {
          font-weight: bold;
          font-size: 1.2em;
        }
        .desc-big-cell {
          text-align: center;
          vertical-align: middle;
        }
        .login-container {
          margin: 40px auto 0 auto;
          width: 500px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .login-header {
          font-size: 2em;
          font-weight: 500;
          margin-bottom: 28px;
        }
        .login-form label {
          display: inline-block;
          width: 140px;
          font-size: 1.2em;
          margin-bottom: 15px;
          text-align: right;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
          width: 260px;
          height: 40px;
          margin-bottom: 20px;
          margin-left: 18px;
          border: 4px solid #000;
          font-size: 1.3em;
          box-sizing: border-box;
        }
        .login-btn-row {
          display: flex;
          justify-content: center;
          margin-top: 33px;
        }
        .login-btn {
          width: 160px;
          height: 62px;
          font-size: 2em;
          color: #bc222d;
          background: #fff;
          border: 4px solid #222;
          margin: 0 15px;
          cursor: pointer;
          box-sizing: border-box;
        }
      `;
      document.head.appendChild(style);
    </script>
</head>
<body>
    <table>
        <tr>
            <th>🦁</th>
            <th colspan="4">LEO BOOK STORE</th>
        </tr>
        <tr>
            <th>Home</th>
            <th>Cover</th>
            <th>Details</th>
            <th>Price</th>
            <th>Add</th>
        </tr>
        <tr>
            <td class="dept">CSE</td>
            <td class="desc-big-cell" colspan="4" rowspan="4">
              <div class="login-container">
                <div class="login-header">Login Page</div>
                <form class="login-form">
                  <div>
                    <label for="username">User Name:</label>
                    <input type="text" id="username" name="username">
                  </div>
                  <div>
                    <label for="password">Passwords:</label>
                    <input type="password" id="password" name="password">
                  </div>
                  <div class="login-btn-row">
                    <button type="submit" class="login-btn">Submit</button>
                    <button type="reset" class="login-btn">Reset</button>
                  </div>
                </form>
              </div>
            </td>
        </tr>
        <tr>
            <td class="dept">ECE</td>
        </tr>
        <tr>
            <td class="dept">EEE</td>
        </tr>
        <tr>
            <td class="dept">CIVIL</td>
        </tr>
    </table>
</body>
</html>
